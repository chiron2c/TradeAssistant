symbols_file: output/specs_enriched.csv

filters:
  # Limit by asset class (or remove this line to include everything):
  include_asset_classes: ["forex", "index", "energy", "metal"]

  # Session requirement options (pick ONE line):
  # sessions_required: ["session_london", "session_newyork"]   # fewer restrictions
  sessions_required: []                                        # no session restriction

lots:
  default_min_lot: 0.01
  default_lot_step: 0.01

risk:
  starting_equity: 3000
  risk_per_trade_pct: 0.5
  max_positions: 8
  default_stop_pips:
    forex: 100
    index: 300
    energy: 300
    metal: 300

